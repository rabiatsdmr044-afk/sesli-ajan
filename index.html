<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesli Asistan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .info-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .info-box p {
            margin: 10px 0;
            line-height: 1.6;
        }

        .assistant-wrapper {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎙️</div>
        <h1>Yapay Zeka Sesli Asistan</h1>
        <p class="subtitle">ElevenLabs tarafından desteklenmektedir</p>
        
        <div class="info-box">
            <p><strong>Hoş Geldiniz!</strong></p>
            <p>Sesli asistanımız sizinle konuşmaya hazır. Mikrofon butonuna tıklayarak sohbete başlayabilirsiniz.</p>
        </div>

        <div class="assistant-wrapper">
            <elevenlabs-convai agent-id="agent_0301kdsjjc4vf348613vq83ed0wj"></elevenlabs-convai>
        </div>

        <footer>
            <p>💡 İpucu: Asistan ile doğal bir şekilde konuşabilirsiniz</p>
        </footer>
    </div>

    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
</body>
</html>
